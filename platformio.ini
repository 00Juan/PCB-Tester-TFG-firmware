; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit MCP4728@^1.0.10
	hideakitai/MCP4728@^0.1.2
	labfruits/Mcp320x@^1.4.2
	simsso/ShiftRegister74HC595@^1.3.1
	fastled/FastLED@^3.6.0
	maffooclock/ESP32RotaryEncoder@^1.2.0
	olikraus/U8g2@^2.34.22


[env:main]
build_src_filter = +<*.cpp> -<main_current.cpp> -<main_pwm.cpp> -<test_mcp4828.cpp> -<test_mcp3208.cpp> -<test_74HC595.cpp> -<test_ws2812b.cpp> -<test_encoder.cpp> -<test_ssd1309.cpp> -<test_LVLPChannel.cpp> -<test_DUTTestbench.cpp> -<test_selftest.cpp>

[env:main_pwm]
build_src_filter = +<*.cpp> -<main.cpp> -<main_current.cpp> -<test_mcp4828.cpp> -<test_mcp3208.cpp> -<test_74HC595.cpp> -<test_ws2812b.cpp> -<test_encoder.cpp> -<test_ssd1309.cpp> -<test_LVLPChannel.cpp> -<test_DUTTestbench.cpp> -<test_selftest.cpp>

