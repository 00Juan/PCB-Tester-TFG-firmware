[env:test_BSPD]
; BSPD (Brake System Plausibility Device) testbench
; Inputs: Hall sensor (HS, CH1), Brake sensor (BS, CH2)
; Output: SDC_OUT monitored on CH3
build_src_filter = +<*.cpp> -<main.cpp> -<main_pwm.cpp> -<main_current.cpp> -<test_mcp4828.cpp> -<test_mcp3208.cpp> -<test_74HC595.cpp> -<test_ws2812b.cpp> -<test_encoder.cpp> -<test_ssd1309.cpp> -<test_LVLPChannel.cpp> -<test_DUTTestbench.cpp> -<test_selftest.cpp> -<test_HPChannel.cpp> -<calibrate_CH1.cpp> -<test.cpp> -<test_HVChannel.cpp> -<test_pwm.cpp> -<app.cpp>


[env:calibrate_CH1]
; External absolute calibration routine for LVLP Channel 1.
; Guides operator through ADC readback, DAC->Output and DAC raw mapping phases.
build_src_filter = +<*.cpp> -<main.cpp> -<main_pwm.cpp> -<main_current.cpp> -<test_mcp4828.cpp> -<test_mcp3208.cpp> -<test_74HC595.cpp> -<test_ws2812b.cpp> -<test_encoder.cpp> -<test_ssd1309.cpp> -<test_LVLPChannel.cpp> -<test_DUTTestbench.cpp> -<test_selftest.cpp> -<test_HPChannel.cpp> -<test_BSPD.cpp> -<test.cpp> -<test_HVChannel.cpp> -<test_pwm.cpp> -<app.cpp>


[env:test]
; General-purpose test sketch: sets all 8 channels to a fixed 1.5 V voltage source.
build_src_filter = +<*.cpp> -<main.cpp> -<main_pwm.cpp> -<main_current.cpp> -<test_mcp4828.cpp> -<test_mcp3208.cpp> -<test_74HC595.cpp> -<test_ws2812b.cpp> -<test_encoder.cpp> -<test_ssd1309.cpp> -<test_LVLPChannel.cpp> -<test_DUTTestbench.cpp> -<test_selftest.cpp> -<test_HPChannel.cpp> -<test_BSPD.cpp> -<calibrate_CH1.cpp> -<test_HVChannel.cpp> -<test_pwm.cpp> -<app.cpp>

[env:test_HVChannel]
; Interactive test and calibration routine for HV Channel(s).
; Guides operator through dead-zone detection and multi-point PWL calibration.
build_src_filter = +<*.cpp> -<main.cpp> -<main_pwm.cpp> -<main_current.cpp> -<test_mcp4828.cpp> -<test_mcp3208.cpp> -<test_74HC595.cpp> -<test_ws2812b.cpp> -<test_encoder.cpp> -<test_ssd1309.cpp> -<test_LVLPChannel.cpp> -<test_DUTTestbench.cpp> -<test_selftest.cpp> -<test_HPChannel.cpp> -<test_BSPD.cpp> -<calibrate_CH1.cpp> -<test.cpp> -<test_pwm.cpp> -<app.cpp>

[env:test_pwm]
; Dedicated PWM generation test for LVLP channels CH1-CH4.
; Connect oscilloscope to pinCtrl1/2/3/4 (GPIO 14/15/16/10).
; Serial commands: d<0-255>  f<Hz>  c<1-4>  s(weep)  p(ause)  ?
build_src_filter = +<*.cpp> -<main.cpp> -<main_pwm.cpp> -<main_current.cpp> -<test_mcp4828.cpp> -<test_mcp3208.cpp> -<test_74HC595.cpp> -<test_ws2812b.cpp> -<test_encoder.cpp> -<test_ssd1309.cpp> -<test_LVLPChannel.cpp> -<test_DUTTestbench.cpp> -<test_selftest.cpp> -<test_HPChannel.cpp> -<test_BSPD.cpp> -<calibrate_CH1.cpp> -<test.cpp> -<test_HVChannel.cpp> -<app.cpp>
