; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit MCP4728@^1.0.10
	hideakitai/MCP4728@^0.1.2
	labfruits/Mcp320x@^1.4.2
	simsso/ShiftRegister74HC595@^1.3.1
	fastled/FastLED@^3.6.0
	maffooclock/ESP32RotaryEncoder@^1.2.0
	olikraus/U8g2@^2.34.22

[env:app]
; Unified application firmware: all channels (8x LVLP + 2x HP + 1x HV) exposed
; to the PC GUI via an NDJSON serial protocol (lib/Protocol).
; Uses the ESP32-S3 NATIVE USB connector (not the UART bridge): baud-agnostic
; USB-CDC, ~1 MB/s effective throughput.
build_src_filter = +<app.cpp>
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	${env.lib_deps}
	bblanchon/ArduinoJson@^7.0.4

[env:main]
build_src_filter = +<*.cpp> -<main_current.cpp> -<main_pwm.cpp> -<test_mcp4828.cpp> -<test_mcp3208.cpp> -<test_74HC595.cpp> -<test_ws2812b.cpp> -<test_encoder.cpp> -<test_ssd1309.cpp> -<test_LVLPChannel.cpp> -<test_DUTTestbench.cpp> -<test_selftest.cpp> -<test_HPChannel.cpp> -<test_BSPD.cpp> -<calibrate_CH1.cpp> -<test.cpp> -<test_HVChannel.cpp> -<test_pwm.cpp> -<app.cpp>

