; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit MCP4728@^1.0.10
	hideakitai/MCP4728@^0.1.2
	labfruits/Mcp320x@^1.4.2
	simsso/ShiftRegister74HC595@^1.3.1
	fastled/FastLED@^3.6.0
	maffooclock/ESP32RotaryEncoder@^1.2.0
	olikraus/U8g2@^2.34.22

[env:main]
build_src_filter = -<*> +<main.cpp>

[env:main_pwm]
build_src_filter = -<*> +<main_pwm.cpp>

[env:main_current]
build_src_filter = -<*> +<main_current.cpp>

[env:test]
build_src_filter = -<*> +<test.cpp>

[env:test_mcp4828]
build_src_filter = -<*> +<test_mcp4828.cpp>

[env:test_mcp3208]
build_src_filter = -<*> +<test_mcp3208.cpp>

[env:test_74HC595]
build_src_filter = -<*> +<test_74HC595.cpp>

[env:test_ws2812b]
build_src_filter = -<*> +<test_ws2812b.cpp>

[env:test_encoder]
build_src_filter = -<*> +<test_encoder.cpp>

[env:test_ssd1309]
build_src_filter = -<*> +<test_ssd1309.cpp>

[env:test_LVLPChannel]
build_src_filter = -<*> +<test_LVLPChannel.cpp>

[env:test_DUTTestbench]
build_src_filter = -<*> +<test_DUTTestbench.cpp>

[env:test_selftest]
; CH1-CH4 = tester  |  CH5-CH8 = DUT simulator
; Wire: CH1<->CH5  CH2<->CH6  CH3<->CH7  CH4<->CH8
build_src_filter = -<*> +<test_selftest.cpp>

[env:test_BSPD]
build_src_filter = -<*> +<test_BSPD.cpp>

[env:test_HPChannel]
build_src_filter = -<*> +<test_HPChannel.cpp>

[env:calibrate_CH1]
; Flash this environment to perform the external absolute calibration of CH1.
; Equipment required: calibrated voltage source (0-10 V) + digital multimeter.
; After flashing, open the serial monitor at 115200 baud and follow the prompts.
build_src_filter = -<*> +<calibrate_CH1.cpp>
