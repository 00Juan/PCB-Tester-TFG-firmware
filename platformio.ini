; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit MCP4728@^1.0.10
	hideakitai/MCP4728@^0.1.2
	labfruits/Mcp320x@^1.4.2
	simsso/ShiftRegister74HC595@^1.3.1

[env:main]
build_src_filter = +<*.cpp> -<test_mcp4828.cpp> -<test_mcp3208.cpp> -<test_74HC595.cpp>

[env:test_mcp4828]
build_src_filter = +<*.cpp> -<main.cpp> -<test_mcp3208.cpp> -<test_74HC595.cpp>


[env:test_mcp3208]
build_src_filter = +<*.cpp> -<main.cpp> -<test_mcp4828.cpp> -<test_74HC595.cpp>


[env:test_74HC595]
build_src_filter = +<*.cpp> -<main.cpp> -<test_mcp4828.cpp> -<test_mcp3208.cpp>
